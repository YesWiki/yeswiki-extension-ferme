parameters:
  bazar_farm_id: 1100
  yeswiki-farm-root-folder: '.'
  yeswiki-farm-admin-email: ''
  yeswiki-farm-prefix: 'yeswiki_'
  yeswiki-farm-db-driver: ''
  yeswiki-farm-db-host: ''
  yeswiki-farm-db-port: ''
  yeswiki-farm-db-admin-user: ''
  yeswiki-farm-db-admin-password: ''
  yeswiki-farm-extensions: []
  yeswiki-farm-archive-on-delete: true
  yeswiki-farm-stats-on-visit: true
  yeswiki-farm-stats-per-visit: 100
  yeswiki-farm-spam-threshold: 3
  yeswiki-farm-spam-words: ''
  yeswiki-farm-spam-hosts: ''
  yeswiki-farm-archive-keep: 604800
  yeswiki-farm-migrate-on-update: true
  yeswiki-farm-mattermost-webhook: ''
  yeswiki-farm-lifetime: false
  yeswiki-farm-lifetime-short: 90
  yeswiki-farm-lifetime-long: 365
  yeswiki-farm-lifetime-grace: 180
  yeswiki-farm-lifetime-reminders: [30, 7]
  yeswiki-farm-lifetime-mail-subject: ''
  yeswiki-farm-lifetime-mail-body: ''
  yeswiki-farm-lifetime-archived-subject: ''
  yeswiki-farm-lifetime-archived-body: ''
  yeswiki-farm-donate-url: ''
  yeswiki-farm-welcome-mail-subject: ''
  yeswiki-farm-welcome-mail-body: ''
  contact_wikis:
    default_template: 'list-email.twig'
  ferme_editable_config_params:
    - 'bazar_farm_id'
    - 'yeswiki-farm-root-folder'
    - 'yeswiki-farm-root-url'
    - 'yeswiki-farm-admin-name'
    - 'yeswiki-farm-admin-pass'
    - 'yeswiki-farm-admin-email'
    - 'yeswiki-farm-homepage'
    - 'yeswiki-farm-default-WikiAdmin'
    - 'yeswiki-farm-password-WikiAdmin'
    - 'yeswiki-farm-email-WikiAdmin'
    - 'yeswiki-farm-create-user'
    - 'yeswiki-farm-prefix'
    - 'yeswiki-farm-db-driver'
    - 'yeswiki-farm-db-host'
    - 'yeswiki-farm-db-port'
    - 'yeswiki-farm-db-admin-user'
    - 'yeswiki-farm-db-admin-password'
    - 'yeswiki-farm-extensions'
    - 'yeswiki-farm-archive-on-delete'
    - 'yeswiki-farm-spam-words'
    - 'yeswiki-farm-spam-hosts'
    - 'yeswiki-farm-stats-on-visit'
    - 'yeswiki-farm-stats-per-visit'
    - 'yeswiki-farm-spam-threshold'
    - 'yeswiki-farm-archive-keep'
    - 'yeswiki-farm-migrate-on-update'
    - contact_wikis:
        - default_template
    - 'yeswiki-farm-mattermost-webhook'
    - 'yeswiki-farm-lifetime'
    - 'yeswiki-farm-lifetime-short'
    - 'yeswiki-farm-lifetime-long'
    - 'yeswiki-farm-lifetime-grace'
    - 'yeswiki-farm-lifetime-reminders'
    - 'yeswiki-farm-lifetime-mail-subject'
    - 'yeswiki-farm-lifetime-mail-body'
    - 'yeswiki-farm-lifetime-archived-subject'
    - 'yeswiki-farm-lifetime-archived-body'
    - 'yeswiki-farm-donate-url'
    - 'yeswiki-farm-welcome-mail-subject'
    - 'yeswiki-farm-welcome-mail-body'

services:
  _defaults:
    autowire: true
    autoconfigure: true
    public: true

  YesWiki\Ferme\Service\:
    resource: 'services/*'
    exclude: 'services/FarmCommand.php'

  YesWiki\Ferme\Service\FarmSubscriber:
    tags:
      - { name: yeswiki.event_subscriber }

  YesWiki\Ferme\Action\:
    resource: 'actions/*'

  YesWiki\Ferme\Controller\:
    resource: 'controllers/*'
